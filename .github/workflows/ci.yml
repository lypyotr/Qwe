name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fast fail: the whole app is one inline <script>; a syntax error or a
      # duplicated function from a botched merge kills every feature at once.
      - name: Inline script static checks
        run: node scripts/check-inline-js.mjs

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Boot smoke test (headless Chromium)
        run: node scripts/smoke.mjs

      - name: Workspace regression tests (headless Chromium)
        run: node scripts/workspace-test.mjs

      - name: Design and quick-entry checks (headless Chromium)
        run: node scripts/design-test.mjs

      - name: Compact journal and avatar tests (headless Chromium)
        run: node scripts/compact-test.mjs

      - name: Messages dashboard tests (headless Chromium)
        run: node scripts/messages-test.mjs

      - name: PWA update tests (headless Chromium)
        run: node scripts/pwa-test.mjs

      - name: Crypto-core tests (headless Chromium)
        run: node scripts/crypto-test.mjs


      - name: Upload design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-design-previews
          path: artifacts/design/
          if-no-files-found: ignore
          retention-days: 7

